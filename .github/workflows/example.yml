name: Send analysis report to channel
on:
  push:
    branches:
      - main
jobs:
  run:
    name: Send report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Set variables
        run: |
          REPORT=$(cat '${{ env.GITHUB_WORKSPACE }}Design Reporting/Report.txt' | sed ':a;N;$!ba;s/\n/\\n/g' )
          echo "REPORT<<EOF" >> $GITHUB_ENV
          echo "$REPORT" >> $GITHUB_ENV
          DATETIME=$(TZ='America/New_York' date)
          echo "EOF" >> $GITHUB_ENV
          echo "DATETIME=$DATETIME" >> $GITHUB_ENV

      - name: Post first message to Slack channel
        id: send_report
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACKBOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: "*${{ env.DATETIME }}*"

      - name: Print Details
        continue-on-error: true
        run: |
          echo ${{ toJSON(steps.send_report.outputs) }}

      - name: Post full repott to a Slack channel
        id: send_full_report
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACKBOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            thread_ts: ${{ steps.send_report.outputs.ts}}
            text: "```${{ env.REPORT }}```"

      - name: Print Details2
        continue-on-error: true
        run: |
          echo ${{ toJSON(steps.send_full_report.outputs) }}

